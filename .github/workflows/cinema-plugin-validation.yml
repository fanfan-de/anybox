name: Cinema plugin matrix validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/Anybox-Plugins/cinema/**"
      - "packages/anyboxagent/src/plugin/**"
      - "packages/anyboxagent/Test/plugin*.test.ts"
      - ".github/workflows/cinema-plugin-validation.yml"

permissions:
  contents: read

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: win32-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libgtk-3-dev libsecret-1-dev pkg-config
      - if: matrix.target == 'darwin-arm64'
        run: test "$(uname -m)" = "arm64"
      - if: matrix.target == 'linux-x64'
        run: test "$(uname -s)/$(uname -m)" = "Linux/x86_64"
      - run: pnpm install --frozen-lockfile --filter @anybox/cinema-plugin...
      - run: pnpm --filter @anybox/cinema-plugin build:helper
      - run: pnpm --filter @anybox/cinema-plugin helper:verify-signature:validation
      - run: cargo test --manifest-path plugins/Anybox-Plugins/cinema/native/cinema-platform-helper/Cargo.toml --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-helper-${{ matrix.target }}
          path: plugins/Anybox-Plugins/cinema/native/artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  package-validation:
    needs: helper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: cinema-helper-win32-x64
          path: plugins/Anybox-Plugins/cinema/native/artifacts/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: cinema-helper-darwin-arm64
          path: plugins/Anybox-Plugins/cinema/native/artifacts/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cinema-helper-linux-x64
          path: plugins/Anybox-Plugins/cinema/native/artifacts/linux-x64
      - run: pnpm install --frozen-lockfile --filter @anybox/cinema-plugin...
      - run: pnpm --filter @anybox/cinema-plugin helpers:assemble:validation
      - run: pnpm --filter @anybox/cinema-plugin check:decoupling
      - run: pnpm --filter @anybox/cinema-plugin typecheck
      - run: pnpm --filter @anybox/cinema-plugin test
      - run: pnpm --filter @anybox/cinema-plugin test:toolchain
      - run: pnpm --filter @anybox/cinema-plugin package:matrix-validation
      - run: pnpm --filter @anybox/cinema-plugin package:smoke
      - run: pnpm --filter @anybox/cinema-plugin exec playwright install --with-deps chromium
      - run: pnpm --filter @anybox/cinema-plugin package:playwright-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-plugin-validation-only
          path: plugins/Anybox-Plugins/cinema/dist/cinema-*.anybox-plugin.zip
          if-no-files-found: error
          retention-days: 7
