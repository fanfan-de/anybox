name: Cinema Deliver signed release candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-regressions:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: Cinema unit and Edit E2E regression
        run: pnpm --filter anybox-cinema-web test && pnpm --filter anybox-cinema-web test:e2e -- --grep-invert "Cinema Deliver workbench"
      - name: Cinema Deliver E2E regression
        run: pnpm --filter anybox-cinema-web test:e2e:deliver
      - name: Desktop capability and release-gate regression
        run: pnpm --filter anybox-desktop-agent typecheck && pnpm --filter anybox-desktop-agent test:media-runtime-lock && pnpm --filter anybox-desktop-agent exec vitest run src/main/managed-agent.test.ts
      - name: Agent Cinema regression
        working-directory: packages/anyboxagent
        run: >-
          bun test Test/cinema.api.test.ts Test/cinema.render-assets.test.ts Test/cinema.render-graph.test.ts
          Test/cinema.render-job-api.test.ts Test/cinema.render-preflight-api.test.ts Test/cinema.render-preflight.test.ts
          Test/cinema.render-queue.test.ts Test/cinema.render-recovery.test.ts Test/cinema.render-retention-api.test.ts
          Test/cinema.render-retention.test.ts Test/cinema.render-runner.test.ts Test/cinema.render-runtime.test.ts
          Test/cinema.render-snapshot.test.ts Test/cinema.render-storage.test.ts

  windows-x64:
    if: github.ref == 'refs/heads/master'
    needs: verify-release-regressions
    runs-on: windows-2022
    environment: cinema-deliver-signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Build release-strict signed Windows candidate
        env:
          CSC_LINK: ${{ secrets.ANYBOX_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ANYBOX_WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm --filter anybox-desktop-agent run dist --win --x64

      - name: Stage complete Windows release asset set
        id: stage
        shell: pwsh
        run: |
          $source = "packages/desktop/dist"
          $target = Join-Path $env:RUNNER_TEMP "cinema-deliver-win32-x64"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $installer = @(Get-ChildItem $source -File -Filter "Anybox-*-x64.exe")
          $blockmap = @(Get-ChildItem $source -File -Filter "Anybox-*-x64.exe.blockmap")
          $metadata = @(Get-ChildItem $source -File -Filter "latest.yml")
          if ($installer.Count -ne 1 -or $blockmap.Count -ne 1 -or $metadata.Count -ne 1) {
            throw "Expected one installer, blockmap, and latest.yml"
          }
          @($installer[0], $blockmap[0], $metadata[0]) | Copy-Item -Destination $target
          node packages/desktop/scripts/describe-desktop-release-candidate.mjs --platform win32 --arch x64 --directory $target --primary $installer[0].Name --output (Join-Path $target "candidate-manifest.json") --commit $env:GITHUB_SHA
          "directory=$target" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: cinema-deliver-win32-x64
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

  macos-arm64:
    if: github.ref == 'refs/heads/master'
    needs: verify-release-regressions
    runs-on: macos-14
    environment: cinema-deliver-signing
    steps:
      - uses: actions/checkout@v4
      - name: Require native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Prepare Apple notarization API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.ANYBOX_APPLE_API_KEY_CONTENT }}
        run: |
          test -n "$APPLE_API_KEY_CONTENT"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build release-strict signed and notarized macOS candidate
        env:
          CSC_LINK: ${{ secrets.ANYBOX_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ANYBOX_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.ANYBOX_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ANYBOX_APPLE_API_ISSUER }}
        run: pnpm --filter anybox-desktop-agent run dist --mac --arm64

      - name: Notarize and staple the final DMG container
        env:
          APPLE_API_KEY_ID: ${{ secrets.ANYBOX_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ANYBOX_APPLE_API_ISSUER }}
        run: |
          dmg="$(find packages/desktop/dist -maxdepth 1 -type f -name 'Anybox-*-arm64.dmg')"
          test "$(find packages/desktop/dist -maxdepth 1 -type f -name 'Anybox-*-arm64.dmg' | wc -l | tr -d ' ')" = "1"
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          node packages/desktop/scripts/refresh-electron-update-metadata.mjs packages/desktop/dist/latest-mac.yml "$dmg"

      - name: Stage complete macOS release asset set
        id: stage
        run: |
          source="packages/desktop/dist"
          target="$RUNNER_TEMP/cinema-deliver-darwin-arm64"
          mkdir -p "$target"
          dmg="$(find "$source" -maxdepth 1 -type f -name 'Anybox-*-arm64.dmg')"
          zip="$(find "$source" -maxdepth 1 -type f -name 'Anybox-*-arm64.zip')"
          dmg_blockmap="$(find "$source" -maxdepth 1 -type f -name 'Anybox-*-arm64.dmg.blockmap')"
          zip_blockmap="$(find "$source" -maxdepth 1 -type f -name 'Anybox-*-arm64.zip.blockmap')"
          metadata="$(find "$source" -maxdepth 1 -type f -name 'latest-mac.yml')"
          for value in "$dmg" "$zip" "$dmg_blockmap" "$zip_blockmap" "$metadata"; do test -f "$value"; done
          cp "$dmg" "$zip" "$dmg_blockmap" "$zip_blockmap" "$metadata" "$target/"
          node packages/desktop/scripts/describe-desktop-release-candidate.mjs --platform darwin --arch arm64 --directory "$target" --primary "$(basename "$dmg")" --output "$target/candidate-manifest.json" --commit "$GITHUB_SHA"
          echo "directory=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cinema-deliver-darwin-arm64
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

  linux-x64:
    if: github.ref == 'refs/heads/master'
    needs: verify-release-regressions
    runs-on: ubuntu-22.04
    environment: cinema-deliver-signing
    steps:
      - uses: actions/checkout@v4
      - name: Require native Linux x64 runner
        run: test "$(uname -s)/$(uname -m)" = "Linux/x86_64"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot librsvg2-bin

      - run: pnpm install --frozen-lockfile

      - name: Build release-strict Linux AppImage and deb candidate
        run: pnpm --filter anybox-desktop-agent run dist --linux --x64

      - name: Stage complete Linux release asset set
        id: stage
        run: |
          source="packages/desktop/dist"
          target="$RUNNER_TEMP/cinema-deliver-linux-x64"
          mkdir -p "$target"
          appimage="$(find "$source" -maxdepth 1 -type f -name 'Anybox-*-x64.AppImage')"
          deb="$(find "$source" -maxdepth 1 -type f -name 'Anybox-*-x64.deb')"
          metadata="$(find "$source" -maxdepth 1 -type f -name 'latest-linux.yml')"
          for pattern in 'Anybox-*-x64.AppImage' 'Anybox-*-x64.deb' 'latest-linux.yml'; do
            test "$(find "$source" -maxdepth 1 -type f -name "$pattern" | wc -l | tr -d ' ')" = "1"
          done
          cp "$appimage" "$deb" "$metadata" "$target/"
          node packages/desktop/scripts/describe-desktop-release-candidate.mjs --platform linux --arch x64 --directory "$target" --primary "$(basename "$appimage")" --output "$target/candidate-manifest.json" --commit "$GITHUB_SHA"
          echo "directory=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cinema-deliver-linux-x64
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
