name: Chrome plugin manual verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-and-tracked-package:
    name: Verify source and committed package
    runs-on: windows-latest

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable the pinned pnpm version
        shell: pwsh
        run: corepack enable

      - name: Install workspace dependencies
        shell: pwsh
        run: corepack pnpm install --frozen-lockfile

      - name: Verify Chrome source projects
        shell: pwsh
        run: |
          corepack pnpm --filter anybox-chrome-extension typecheck
          corepack pnpm --filter anybox-chrome-native-host typecheck
          corepack pnpm --filter anybox-chrome-native-host test
          cargo fmt --check --manifest-path packages/chrome-plugin/browser-native-host/Cargo.toml

      - name: Test packaging, build targeting, and release gates
        shell: pwsh
        run: corepack pnpm chrome-plugin:package:test

      - name: Strictly validate the committed three-target package
        shell: pwsh
        run: |
          node --input-type=module -e "import { validateChromePluginPackage } from './packages/chrome-plugin/tools/package-chrome-plugin.mjs'; await validateChromePluginPackage('./plugins/Anybox-Plugins/chrome', { nativeHostScope: 'all' })"

      - name: Verify Anybox loads and runs the plugin
        shell: pwsh
        working-directory: packages/anyboxagent
        run: |
          bun test ./Test/mcp.test.ts ./Test/node-repl-mcp.test.ts
          bun test ./Test/plugin-platform-artifacts.test.ts
          bun test ./Test/plugin.test.ts

  build-native-hosts:
    name: Verification-only Native Host (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32/x64
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - runner: macos-15-intel
            target: darwin/x64
            rust_target: x86_64-apple-darwin
            artifact: macos-x64
          - runner: macos-15
            target: darwin/arm64
            rust_target: aarch64-apple-darwin
            artifact: macos-arm64

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Test the native platform host
        run: cargo test --locked --manifest-path packages/chrome-plugin/browser-native-host/Cargo.toml

      - name: Build the verification-only platform host
        run: node packages/chrome-plugin/browser-native-host/tools/build.mjs --target ${{ matrix.target }}

      - name: Upload verification-only Native Host
        uses: actions/upload-artifact@v4
        with:
          name: chrome-native-host-verification-only-${{ matrix.artifact }}
          path: packages/chrome-plugin/browser-native-host/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-assembled-package:
    name: Assemble unsigned verification-only package
    needs:
      - verify-source-and-tracked-package
      - build-native-hosts
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable the pinned pnpm version
        run: corepack enable

      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Download verification-only Native Hosts
        uses: actions/download-artifact@v4
        with:
          pattern: chrome-native-host-verification-only-*
          path: packages/chrome-plugin/browser-native-host/dist
          merge-multiple: true

      - name: Build platform-independent Chrome components
        env:
          ANYBOX_BROWSER_EXTENSION_SOURCEMAP: "false"
        run: |
          corepack pnpm --filter anybox-chrome-browser-host build
          corepack pnpm --filter anybox-chrome-browser-runtime build
          corepack pnpm --filter anybox-chrome-extension build

      - name: Assemble and strictly validate all declared targets
        run: node packages/chrome-plugin/tools/package-chrome-plugin.mjs --skip-build --all-native-hosts

      - name: Upload unsigned package for diagnostics only
        uses: actions/upload-artifact@v4
        with:
          name: chrome-plugin-verification-only-unsigned
          path: plugins/Anybox-Plugins/chrome
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
