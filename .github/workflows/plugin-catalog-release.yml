name: Publish Anybox plugin catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anybox-plugin-catalog
  cancel-in-progress: false

jobs:
  publish-plugin-catalog:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Verify plugin inventory, release builder, and Agent runtime
        run: |
          pnpm plugins:index:check
          pnpm plugins:release:test
          cd packages/anyboxagent
          bun test Test/plugin.test.ts

      - name: Build independent plugin catalog assets
        run: |
          node plugins/Anybox-Plugins/scripts/build-plugin-release.mjs \
            --commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/anybox-plugin-catalog"
          node plugins/Anybox-Plugins/scripts/verify-plugin-release.mjs \
            --dir "$RUNNER_TEMP/anybox-plugin-catalog" \
            --commit "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: anybox-plugin-catalog-${{ github.sha }}
          path: ${{ runner.temp }}/anybox-plugin-catalog
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable plugin ZIPs and promote the stable catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CATALOG_TAG: anybox-plugin-catalog
          CATALOG_DIR: ${{ runner.temp }}/anybox-plugin-catalog
        run: |
          if ! gh release view "$CATALOG_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$CATALOG_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Anybox Plugin Catalog" \
              --notes "Stable Anybox plugin catalog channel. Managed by plugin-catalog-release.yml." \
              --latest=false
          fi

          published="$(mktemp -d)"
          for asset in "$CATALOG_DIR"/anybox-plugin-*.zip; do
            name="$(basename "$asset")"
            if gh release download "$CATALOG_TAG" --repo "$GH_REPO" --pattern "$name" --dir "$published" >/dev/null 2>&1; then
              cmp "$asset" "$published/$name"
            else
              gh release upload "$CATALOG_TAG" "$asset" --repo "$GH_REPO"
            fi
          done

          gh release upload "$CATALOG_TAG" \
            "$CATALOG_DIR/anybox-plugin-release-manifest.json" \
            --repo "$GH_REPO" \
            --clobber
          gh release upload "$CATALOG_TAG" \
            "$CATALOG_DIR/anybox-plugin-registry.json" \
            --repo "$GH_REPO" \
            --clobber

      - name: Verify the stable catalog and install one published plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CATALOG_TAG: anybox-plugin-catalog
        run: |
          published="$(mktemp -d)"
          gh release download "$CATALOG_TAG" \
            --repo "$GH_REPO" \
            --pattern anybox-plugin-registry.json \
            --dir "$published"
          cmp "$RUNNER_TEMP/anybox-plugin-catalog/anybox-plugin-registry.json" "$published/anybox-plugin-registry.json"
          bun run packages/anyboxagent/scripts/smoke-plugin-release-install.ts \
            "$published/anybox-plugin-registry.json" \
            context7
