name: Cinema Deliver Beta installers

on:
  workflow_dispatch:
    inputs:
      ffmpeg_revision:
        description: Exact FFmpeg Git revision to bundle
        required: true
        default: 8ad6288553

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            nasm
            mingw-w64-x86_64-gcc
      - run: pnpm install --frozen-lockfile
      - name: Build and smoke Windows media runtime
        shell: msys2 {0}
        env:
          ANYBOX_FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
          ANYBOX_MEDIA_RUNTIME_RUN_SMOKE: "1"
        run: |
          export ANYBOX_MEDIA_RUNTIME_OUTPUT_DIR="$(cygpath -u "$RUNNER_TEMP")/anybox-deliver-beta-runtime"
          bash packages/desktop/scripts/build-media-runtime.sh win32 x64
      - name: Package Windows Deliver Beta
        shell: pwsh
        env:
          ANYBOX_FFMPEG_BINARY: ${{ runner.temp }}\anybox-deliver-beta-runtime\stage\ffmpeg.exe
          ANYBOX_FFPROBE_BINARY: ${{ runner.temp }}\anybox-deliver-beta-runtime\stage\ffprobe.exe
          ANYBOX_MEDIA_RUNTIME_MATERIALS_DIR: ${{ runner.temp }}\anybox-deliver-beta-runtime\stage
        run: pnpm --filter anybox-desktop-agent dist:deliver-beta -- --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: anybox-deliver-beta-win32-x64
          path: |
            packages/desktop/dist/deliver-beta/*.exe
            packages/desktop/dist/deliver-beta/*.blockmap
            packages/desktop/dist/deliver-beta/latest.yml
          if-no-files-found: error
          retention-days: 30

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Require native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: brew install nasm
      - run: pnpm install --frozen-lockfile
      - name: Build and smoke Apple Silicon media runtime
        env:
          ANYBOX_FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
          ANYBOX_MEDIA_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/anybox-deliver-beta-runtime
          ANYBOX_MEDIA_RUNTIME_RUN_SMOKE: "1"
        run: bash packages/desktop/scripts/build-media-runtime.sh darwin arm64
      - name: Package Apple Silicon Deliver Beta
        env:
          ANYBOX_FFMPEG_BINARY: ${{ runner.temp }}/anybox-deliver-beta-runtime/stage/ffmpeg
          ANYBOX_FFPROBE_BINARY: ${{ runner.temp }}/anybox-deliver-beta-runtime/stage/ffprobe
          ANYBOX_MEDIA_RUNTIME_MATERIALS_DIR: ${{ runner.temp }}/anybox-deliver-beta-runtime/stage
        run: pnpm --filter anybox-desktop-agent dist:deliver-beta -- --mac --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: anybox-deliver-beta-darwin-arm64
          path: |
            packages/desktop/dist/deliver-beta/*.dmg
            packages/desktop/dist/deliver-beta/*.zip
            packages/desktop/dist/deliver-beta/*.blockmap
            packages/desktop/dist/deliver-beta/latest-mac.yml
          if-no-files-found: error
          retention-days: 30
