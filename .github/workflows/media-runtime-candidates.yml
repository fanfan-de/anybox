name: Media runtime candidate builds

on:
  workflow_dispatch:
    inputs:
      ffmpeg_revision:
        description: Exact FFmpeg Git revision to build
        required: true
        default: 8ad6288553

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            nasm
            curl
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-gcc
      - name: Build locked-policy Windows candidate
        shell: msys2 {0}
        env:
          ANYBOX_FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
          ANYBOX_MEDIA_RUNTIME_RUN_SMOKE: "1"
        run: |
          export ANYBOX_MEDIA_RUNTIME_OUTPUT_DIR="$(cygpath -u "$RUNNER_TEMP")/anybox-media-runtime-win32-x64"
          bash packages/desktop/scripts/build-media-runtime.sh win32 x64
      - uses: actions/upload-artifact@v4
        with:
          name: anybox-media-runtime-win32-x64-unapproved
          path: ${{ runner.temp }}/anybox-media-runtime-win32-x64
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assert native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Install assembler and subtitle renderer dependencies
        run: brew install nasm pkg-config libass freetype fribidi harfbuzz
      - name: Build and smoke macOS candidate
        env:
          ANYBOX_FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
          ANYBOX_MEDIA_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/anybox-media-runtime-darwin-arm64
          ANYBOX_MEDIA_RUNTIME_RUN_SMOKE: "1"
        run: bash packages/desktop/scripts/build-media-runtime.sh darwin arm64
      - uses: actions/upload-artifact@v4
        with:
          name: anybox-media-runtime-darwin-arm64-unapproved
          path: ${{ runner.temp }}/anybox-media-runtime-darwin-arm64
          if-no-files-found: error
