name: Media runtime candidate builds

on:
  workflow_dispatch:
    inputs:
      ffmpeg_revision:
        description: Exact FFmpeg Git revision to build
        required: true
        default: 8ad6288553

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            nasm
            curl
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-gcc
      - name: Build locked-policy Windows candidate
        shell: msys2 {0}
        env:
          CINEMA_TOOLCHAIN_FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
          CINEMA_TOOLCHAIN_RUN_SMOKE: "1"
        run: |
          export CINEMA_TOOLCHAIN_OUTPUT_DIR="$(cygpath -u "$RUNNER_TEMP")/cinema-toolchain-win32-x64"
          bash plugins/Anybox-Plugins/cinema/toolchain/scripts/build-media-runtime.sh win32 x64
      - uses: actions/upload-artifact@v4
        with:
          name: anybox-media-runtime-win32-x64-unapproved
          path: ${{ runner.temp }}/cinema-toolchain-win32-x64
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assert native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Install assembler and subtitle renderer dependencies
        run: brew install nasm pkg-config libass freetype fribidi harfbuzz
      - name: Build and smoke macOS candidate
        env:
          CINEMA_TOOLCHAIN_FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
          CINEMA_TOOLCHAIN_OUTPUT_DIR: ${{ runner.temp }}/cinema-toolchain-darwin-arm64
          CINEMA_TOOLCHAIN_RUN_SMOKE: "1"
        run: bash plugins/Anybox-Plugins/cinema/toolchain/scripts/build-media-runtime.sh darwin arm64
      - uses: actions/upload-artifact@v4
        with:
          name: anybox-media-runtime-darwin-arm64-unapproved
          path: ${{ runner.temp }}/cinema-toolchain-darwin-arm64
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert native Linux x64 runner
        run: test "$(uname -s)/$(uname -m)" = "Linux/x86_64"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python for pinned Meson
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            git \
            nasm \
            ninja-build \
            pkg-config
          python -m pip install --disable-pip-version-check meson==1.8.3
      - name: Build pinned GPL Linux candidate
        env:
          CINEMA_TOOLCHAIN_FFMPEG_REVISION: ${{ inputs.ffmpeg_revision }}
          CINEMA_TOOLCHAIN_X264_REVISION: b35605ace3ddf7c1a5d67a2eb553f034aef41d55
          CINEMA_TOOLCHAIN_OUTPUT_DIR: ${{ runner.temp }}/cinema-toolchain-linux-x64
          CINEMA_TOOLCHAIN_RUN_SMOKE: "1"
        run: bash plugins/Anybox-Plugins/cinema/toolchain/scripts/build-media-runtime.sh linux x64
      - uses: actions/upload-artifact@v4
        with:
          name: anybox-media-runtime-linux-x64-unapproved
          path: ${{ runner.temp }}/cinema-toolchain-linux-x64
          if-no-files-found: error
