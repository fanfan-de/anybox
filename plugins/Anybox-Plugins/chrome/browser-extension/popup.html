<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anybox Chrome</title>
    <script type="module" crossorigin src="/popup.js"></script>
    <link rel="modulepreload" crossorigin href="/chunks/status-D5415wll.js">
    <link rel="stylesheet" crossorigin href="/assets/popup-da6n0uX-.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <span class="popup-logo" aria-hidden="true"></span>
        <div>
          <h1>Anybox Chrome</h1>
          <p>Extension bridge</p>
        </div>
      </header>
      <section class="status-card">
        <div class="status-row">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <strong id="status-label">Checking</strong>
        </div>
        <p id="status-detail">Connecting to Anybox Browser Host...</p>
        <dl id="status-metrics" class="status-metrics" hidden>
          <div>
            <dt>Protocol</dt>
            <dd id="status-protocol">—</dd>
          </div>
          <div>
            <dt>Reconnects</dt>
            <dd id="status-reconnects">0</dd>
          </div>
          <div>
            <dt>Last cleanup</dt>
            <dd id="status-cleanup">—</dd>
          </div>
        </dl>
      </section>
      <button id="reconnect-button" type="button">Reconnect</button>
    </main>
  </body>
</html>
