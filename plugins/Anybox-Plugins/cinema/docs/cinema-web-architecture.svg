  <rect class="bg" x="0" y="0" width="1500" height="980"/>

  <text x="60" y="56" style="font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#0f172a;">Anybox Cinema App Plugin Architecture</text>
  <text x="60" y="84" class="small">React canvas SPA and local HTTP runtime shipped by the Cinema plugin, connected through an authenticated same-origin gateway.</text>

  <rect class="section" x="48" y="120" width="360" height="220"/>
  <text x="72" y="155" class="section-title">Entry</text>
  <rect class="box box-slate" x="78" y="180" width="300" height="54"/>
  <text x="98" y="212" class="text">User / Anybox Desktop</text>
  <rect class="box box-blue" x="78" y="260" width="300" height="54"/>
  <text x="98" y="287" class="text">anybox-preview://&lt;view&gt;/...</text>
  <text x="98" y="306" class="tiny">authorized anyboxProjectID context</text>

  <rect class="section" x="462" y="120" width="460" height="430"/>
  <text x="486" y="155" class="section-title">cinema-web Frontend</text>
  <rect class="box box-blue" x="492" y="180" width="400" height="56"/>
  <text x="512" y="207" class="text">React 19 + Vite 7 + TypeScript</text>
  <text x="512" y="226" class="tiny">plugin web bundle, relative base path ./</text>
  <rect class="box box-blue" x="492" y="260" width="185" height="70"/>
  <text x="512" y="288" class="text">React Flow</text>
  <text x="512" y="307" class="tiny">nodes, edges, viewport</text>
  <rect class="box box-blue" x="707" y="260" width="185" height="70"/>
  <text x="727" y="288" class="text">React Query</text>
  <text x="727" y="307" class="tiny">queries, mutations</text>
  <rect class="box box-blue" x="492" y="354" width="185" height="70"/>
  <text x="512" y="382" class="text">Zustand</text>
  <text x="512" y="401" class="tiny">selected node state</text>
  <rect class="box box-blue" x="707" y="354" width="185" height="70"/>
  <text x="727" y="382" class="text">CSS + lucide</text>
  <text x="727" y="401" class="tiny">custom UI styling</text>
  <rect class="box box-blue" x="492" y="448" width="400" height="62"/>
  <text x="512" y="475" class="text">Cinema node UI</text>
  <text x="512" y="494" class="tiny">text, image, video, shot, generation-task, output</text>

  <rect class="section" x="980" y="120" width="470" height="430"/>
  <text x="1004" y="155" class="section-title">Cinema App Plugin</text>
  <rect class="box box-green" x="1010" y="180" width="190" height="70"/>
  <text x="1030" y="208" class="text">Plugin View Assets</text>
  <text x="1030" y="227" class="tiny">ships inside plugin/web</text>
  <rect class="box box-green" x="1230" y="180" width="190" height="70"/>
  <text x="1250" y="208" class="text">Hono Local Runtime</text>
  <text x="1250" y="227" class="tiny">loopback + runtime token</text>
  <rect class="box box-green" x="1010" y="282" width="410" height="70"/>
  <text x="1030" y="310" class="text">Cinema usecases</text>
  <text x="1030" y="329" class="tiny">canvas commands, events, tasks, assets, summaries</text>
  <rect class="box box-green" x="1010" y="384" width="190" height="82"/>
  <text x="1030" y="412" class="text">Provider runtime</text>
  <text x="1030" y="431" class="tiny">video catalog</text>
  <text x="1030" y="448" class="tiny">KlingAI adapter</text>
  <rect class="box box-green" x="1230" y="384" width="190" height="82"/>
  <text x="1250" y="412" class="text">AI SDK runtime</text>
  <text x="1250" y="431" class="tiny">generateText</text>
  <text x="1250" y="448" class="tiny">generateImage</text>

  <rect class="section" x="462" y="600" width="460" height="300"/>
  <text x="486" y="635" class="section-title">@anybox/cinema-plugin/contracts</text>
  <rect class="box box-purple" x="492" y="662" width="400" height="56"/>
  <text x="512" y="690" class="text">Zod schemas + TypeScript types</text>
  <rect class="box box-purple" x="492" y="742" width="185" height="66"/>
  <text x="512" y="770" class="text">Canvas</text>
  <text x="512" y="789" class="tiny">nodes, edges, viewport</text>
  <rect class="box box-purple" x="707" y="742" width="185" height="66"/>
  <text x="727" y="770" class="text">Commands</text>
  <text x="727" y="789" class="tiny">create, update, connect</text>
  <rect class="box box-purple" x="492" y="832" width="400" height="44"/>
  <text x="512" y="860" class="text">Generation contracts: text, image, video tasks</text>

  <rect class="section" x="48" y="600" width="360" height="300"/>
  <text x="72" y="635" class="section-title">Project Files</text>
  <rect class="box box-amber" x="78" y="662" width="300" height="54"/>
  <text x="98" y="694" class="text">.anybox-cinema/</text>
  <rect class="box box-amber" x="78" y="742" width="135" height="50"/>
  <text x="98" y="773" class="small">canvas.json</text>
  <rect class="box box-amber" x="243" y="742" width="135" height="50"/>
  <text x="263" y="773" class="small">events.jsonl</text>
  <rect class="box box-amber" x="78" y="818" width="135" height="50"/>
  <text x="98" y="849" class="small">tasks/*.json</text>
  <rect class="box box-amber" x="243" y="818" width="135" height="50"/>
  <text x="263" y="849" class="small">generated/</text>

  <rect class="section" x="980" y="600" width="470" height="300"/>
  <text x="1004" y="635" class="section-title">External AI Providers</text>
  <rect class="box box-rose" x="1010" y="662" width="410" height="54"/>
  <text x="1030" y="694" class="text">Providers-ModelsWiki catalog</text>
  <rect class="box box-rose" x="1010" y="742" width="190" height="66"/>
  <text x="1030" y="770" class="text">Text models</text>
  <text x="1030" y="789" class="tiny">Anybox provider system</text>
  <rect class="box box-rose" x="1230" y="742" width="190" height="66"/>
  <text x="1250" y="770" class="text">Image models</text>
  <text x="1250" y="789" class="tiny">Anybox provider system</text>
  <rect class="box box-rose" x="1010" y="832" width="410" height="44"/>
  <text x="1030" y="860" class="text">Video generation adapter: KlingAI</text>

