[package]
name = "cinema-platform-helper"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Native keychain and file-dialog helper for the Anybox Cinema plugin"

[dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
