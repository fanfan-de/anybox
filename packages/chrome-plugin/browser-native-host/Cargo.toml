[package]
name = "anybox-chrome-native-host"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Native Messaging host for the Anybox Chrome plugin"
publish = false

[[bin]]
name = "extension-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
interprocess = "2.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
