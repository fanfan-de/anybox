[package]
name = "anybox-chrome-native-host"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Native Messaging host for the Anybox Chrome plugin"
publish = false

[[bin]]
name = "extension-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
