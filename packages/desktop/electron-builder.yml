appId: com.anybox.app
productName: Anybox
artifactName: Anybox-${version}-${arch}.${ext}
asar: true
# Authenticode is optional for the current zero-budget open-source Windows release.
# When signing credentials are configured, electron-builder still signs normally.
forceCodeSigning: false
electronUpdaterCompatibility: ">=2.16"
afterPack: ./scripts/after-pack-icon.cjs
publish:
  provider: github
  owner: fanfan-de
  repo: anybox
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.ico
    to: build/icon.ico
  - from: build/icon.png
    to: build/icon.png
  - from: build/trayTemplate.png
    to: build/trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: build/trayTemplate@2x.png
  - from: build/agent-runtime
    to: agent
    filter:
      - "**/*"
  - from: ../monitor/dist
    to: monitor
    filter:
      - "**/*"
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: build/icon.ico
  publish:
    - provider: generic
      url: https://download.anybox.com.cn/updates/windows/x64
    - provider: github
      owner: fanfan-de
      repo: anybox
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: build/icon.png
  category: Utility
  artifactName: Anybox-${version}-x64.${ext}
  maintainer: fanfan-de <fanfan-de@users.noreply.github.com>
  vendor: Anybox contributors
  publish:
    - provider: generic
      url: https://download.anybox.com.cn/updates/linux/x64
    - provider: github
      owner: fanfan-de
      repo: anybox
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/installerIcon.ico
  installerHeaderIcon: build/installerIcon.ico
  uninstallerIcon: build/installerIcon.ico
