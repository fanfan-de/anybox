name: anybox-mobile-update

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  update-server:
    build:
      context: ../..
      dockerfile: packages/mobile-update-server/Dockerfile
      target: runner
    container_name: anybox-mobile-update-server
    restart: unless-stopped
    init: true
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3210
      MOBILE_UPDATE_CDN_BASE_URL: https://download.anybox.com.cn
      ANYBOX_OTA_CERTIFICATE_PATH: /run/anybox-public/ota-certificate.pem
    expose:
      - "3210"
    volumes:
      - ../mobile-app/credentials/ota-certificate.pem:/run/anybox-public/ota-certificate.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - provider_app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3210/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  provider_app:
    external: true
    name: anybox-provider_app
