plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.anybox.mobile.updater'
version = '1.0.0'

android {
  namespace "com.anybox.mobile.updater"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core:1.17.0'
}
